<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-star"></i> My Marks</h2>
        </div>
        <div class="content-card">
            <p:dataTable value="#{studentBean.myMarks}" var="m"
                         emptyMessage="No marks recorded yet." styleClass="sms-table">
                <p:column headerText="Course">
                    <h:outputText value="#{m.course.courseName}"/>
                </p:column>
                <p:column headerText="Marks">
                    <h:outputText value="#{m.marks}"/>
                </p:column>
                <p:column headerText="Grade">
                    <h:outputText value="#{m.grade}"
                                  style="font-weight:bold;color:#{m.grade == 'A' ? '#27ae60' : m.grade == 'F' ? '#e74c3c' : '#2980b9'}"/>
                </p:column>
            </p:dataTable>
            <div class="summary-bar">
                <strong>Average: </strong>
                <h:outputText value="#{studentBean.averageMarks}">
                    <f:convertNumber maxFractionDigits="2"/>
                </h:outputText>%
            </div>
        </div>
    </ui:define>
</ui:composition>
</html>
