<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-tachometer-alt"></i> Student Dashboard</h2>
        </div>
        <div class="welcome-banner">
            <h3>Welcome, <strong>#{loginBean.currentUser.username}</strong>!</h3>
            <p>Here is your academic summary.</p>
        </div>
        <div class="stat-cards">
            <div class="stat-card stat-blue">
                <div class="stat-icon"><i class="fas fa-star"></i></div>
                <div class="stat-info">
                    <div class="stat-number">
                        <h:outputText value="#{studentBean.averageMarks}">
                            <f:convertNumber maxFractionDigits="1"/>
                        </h:outputText>%
                    </div>
                    <div class="stat-label">Average Marks</div>
                </div>
            </div>
            <div class="stat-card stat-green">
                <div class="stat-icon"><i class="fas fa-book"></i></div>
                <div class="stat-info">
                    <div class="stat-number">#{studentBean.myMarks != null ? studentBean.myMarks.size() : 0}</div>
                    <div class="stat-label">Courses</div>
                </div>
            </div>
            <div class="stat-card stat-orange">
                <div class="stat-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="stat-info">
                    <div class="stat-number">#{studentBean.announcements.size()}</div>
                    <div class="stat-label">Announcements</div>
                </div>
            </div>
        </div>
        <div class="content-card" style="margin-top:30px;">
            <div class="card-header"><h3>Latest Announcement</h3></div>
            <p:dataTable value="#{studentBean.announcements}" var="ann"
                         emptyMessage="No announcements." styleClass="sms-table" rows="3">
                <p:column headerText="Date"><h:outputText value="#{ann.date}"/></p:column>
                <p:column headerText="Message"><h:outputText value="#{ann.message}"/></p:column>
            </p:dataTable>
        </div>
    </ui:define>
</ui:composition>
</html>
