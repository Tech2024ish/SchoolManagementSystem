<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-users"></i> Parent Information</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <h:form id="parentForm">
            <div class="content-card">
                <div class="form-grid">
                    <div class="form-field">
                        <label>First Name</label>
                        <p:inputText value="#{studentBean.parentInfo.firstName}" style="width:100%"/>
                    </div>
                    <div class="form-field">
                        <label>Last Name</label>
                        <p:inputText value="#{studentBean.parentInfo.lastName}" style="width:100%"/>
                    </div>
                    <div class="form-field">
                        <label>Email</label>
                        <p:inputText value="#{studentBean.parentInfo.email}" style="width:100%"/>
                    </div>
                    <div class="form-field">
                        <label>Telephone</label>
                        <p:inputText value="#{studentBean.parentInfo.telephone}" style="width:100%"/>
                    </div>
                    <div class="form-field" style="grid-column:1/-1">
                        <label>Location</label>
                        <p:inputText value="#{studentBean.parentInfo.location}" style="width:100%"/>
                    </div>
                </div>
                <p:commandButton value="Save" icon="pi pi-save" styleClass="btn-primary"
                                 action="#{studentBean.saveParentInfo}"
                                 update="msgs" process="parentForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
