<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>SMS - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
    <style>
        body { margin: 0; padding: 0; min-height: 100vh;
               background: linear-gradient(135deg, #2C3E50 0%, #3498DB 100%);
               display: flex; align-items: center; justify-content: center;
               font-family: 'Segoe UI', sans-serif; }
        .login-card { background: #fff; border-radius: 12px; padding: 40px;
                      width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-logo { text-align: center; font-size: 60px; margin-bottom: 10px; }
        .login-title { text-align: center; font-size: 22px; font-weight: 700;
                       color: #2C3E50; margin: 0 0 5px; }
        .login-subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin: 0 0 30px; }
        .login-field { margin-bottom: 20px; }
        .login-field label { display: block; font-weight: 600; color: #2C3E50;
                             margin-bottom: 6px; font-size: 14px; }
        .login-field .ui-inputtext { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0;
                                      border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
        .login-field .ui-inputtext:focus { border-color: #3498DB; outline: none; }
        .btn-login { width: 100%; background: #3498DB; color: #fff; border: none;
                     padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600;
                     cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #2980B9; }
        .login-error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</h:head>
<h:body>
    <div class="login-card">
        <div class="login-logo">&#127891;</div>
        <h1 class="login-title">School Management System</h1>
        <p class="login-subtitle">Please sign in to continue</p>

        <h:form id="loginForm">
            <p:messages id="msgs" showDetail="true" closable="true"/>
            <div class="login-field">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <p:inputText id="username" value="#{loginBean.username}"
                             placeholder="Enter username" required="true"
                             requiredMessage="Username is required"/>
            </div>
            <div class="login-field">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <p:password id="password" value="#{loginBean.password}"
                            placeholder="Enter password" required="true"
                            requiredMessage="Password is required" feedback="false"/>
            </div>
            <p:commandButton value="Sign In" action="#{loginBean.login}"
                             styleClass="btn-login" ajax="false"
                             icon="pi pi-sign-in"/>
        </h:form>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</h:body>
</html>
