<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-user-md"></i> Manage Doctors</h2>
            <p:commandButton value="Add Doctor" icon="pi pi-plus" styleClass="btn-primary"
                             onclick="PF('doctorDlg').show()"
                             action="#{medicalBean.prepareNewDoctor}"
                             update="doctorForm" process="@this"/>
        </div>

        <p:growl id="msgs" life="4000"/>

        <div class="content-card">
            <p:dataTable id="doctorTable" value="#{medicalBean.doctors}" var="d"
                         emptyMessage="No doctors found." styleClass="sms-table"
                         paginator="true" rows="10">
                <p:column headerText="Full Name">
                    <h:outputText value="#{d.firstName} #{d.lastName}"/>
                </p:column>
                <p:column headerText="Hospital">
                    <h:outputText value="#{d.hospitalName}"/>
                </p:column>
                <p:column headerText="Email">
                    <h:outputText value="#{d.email}"/>
                </p:column>
                <p:column headerText="Telephone">
                    <h:outputText value="#{d.telephone}"/>
                </p:column>
                <p:column headerText="Address">
                    <h:outputText value="#{d.address}"/>
                </p:column>
                <p:column headerText="Actions" style="width:120px">
                    <p:commandButton icon="pi pi-pencil" styleClass="btn-edit"
                                     action="#{medicalBean.editDoctor(d)}"
                                     onclick="PF('doctorDlg').show()"
                                     update="doctorForm" process="@this" title="Edit"/>
                    <p:commandButton icon="pi pi-trash" styleClass="btn-danger"
                                     action="#{medicalBean.deleteDoctor(d)}"
                                     update="doctorTable msgs" process="@this" title="Delete">
                        <p:confirm header="Confirm Delete" message="Delete this doctor?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </div>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes btn-danger"/>
            <p:commandButton value="No"  type="button" styleClass="ui-confirmdialog-no"/>
        </p:confirmDialog>

        <p:dialog header="Doctor Details" widgetVar="doctorDlg" modal="true" width="600" closeOnEscape="true">
            <h:form id="doctorForm">
                <div class="form-grid">
                    <div class="form-field"><label>First Name</label>
                        <p:inputText value="#{medicalBean.selectedDoctor.firstName}" required="true"/></div>
                    <div class="form-field"><label>Last Name</label>
                        <p:inputText value="#{medicalBean.selectedDoctor.lastName}" required="true"/></div>
                    <div class="form-field"><label>Email</label>
                        <p:inputText value="#{medicalBean.selectedDoctor.email}"/></div>
                    <div class="form-field"><label>Telephone</label>
                        <p:inputText value="#{medicalBean.selectedDoctor.telephone}"/></div>
                    <div class="form-field"><label>Hospital Name</label>
                        <p:inputText value="#{medicalBean.selectedDoctor.hospitalName}"/></div>
                    <div class="form-field" style="grid-column:1/-1"><label>Address</label>
                        <p:inputText value="#{medicalBean.selectedDoctor.address}"/></div>
                </div>
                <div class="dialog-footer">
                    <p:commandButton value="Save" icon="pi pi-check" styleClass="btn-primary"
                                     action="#{medicalBean.saveDoctor}"
                                     update="doctorTable msgs" process="doctorForm"
                                     oncomplete="if(!args.validationFailed) PF('doctorDlg').hide()"/>
                    <p:commandButton value="Cancel" icon="pi pi-times"
                                     onclick="PF('doctorDlg').hide()" type="button"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
</html>
