<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-calendar-check"></i> Appointments</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <div class="content-card">
            <p:dataTable value="#{appointmentBean.appointments}" var="apt"
                         emptyMessage="No appointments." styleClass="sms-table"
                         paginator="true" rows="10">
                <p:column headerText="Requested By">
                    <h:outputText value="#{apt.requestedBy.username}"/>
                </p:column>
                <p:column headerText="Purpose">
                    <h:outputText value="#{apt.purpose}"/>
                </p:column>
                <p:column headerText="Responsible">
                    <h:outputText value="#{apt.responsible}"/>
                </p:column>
                <p:column headerText="Date">
                    <h:outputText value="#{apt.date}"/>
                </p:column>
            </p:dataTable>
        </div>
    </ui:define>
</ui:composition>
</html>
