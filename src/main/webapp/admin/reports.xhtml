<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-file-alt"></i> Reports</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <div class="content-card" style="margin-bottom:20px;">
            <div class="card-header"><h3>Generate Report</h3></div>
            <h:form>
                <div style="display:flex;gap:10px;flex-wrap:wrap;padding:15px;">
                    <p:commandButton value="Student Report" icon="pi pi-file"
                                     action="#{reportBean.generateReport('Student Report')}"
                                     update="reportTable msgs" styleClass="btn-primary"/>
                    <p:commandButton value="Teacher Report" icon="pi pi-file"
                                     action="#{reportBean.generateReport('Teacher Report')}"
                                     update="reportTable msgs" styleClass="btn-primary"/>
                    <p:commandButton value="Marks Report" icon="pi pi-file"
                                     action="#{reportBean.generateReport('Marks Report')}"
                                     update="reportTable msgs" styleClass="btn-primary"/>
                    <p:commandButton value="Attendance Report" icon="pi pi-file"
                                     action="#{reportBean.generateReport('Attendance Report')}"
                                     update="reportTable msgs" styleClass="btn-primary"/>
                </div>
            </h:form>
        </div>
        <div class="content-card">
            <p:dataTable id="reportTable" value="#{reportBean.reports}" var="r"
                         emptyMessage="No reports generated." styleClass="sms-table"
                         paginator="true" rows="10">
                <p:column headerText="Type">
                    <h:outputText value="#{r.type}"/>
                </p:column>
                <p:column headerText="Date">
                    <h:outputText value="#{r.date}"/>
                </p:column>
                <p:column headerText="Generated By">
                    <h:outputText value="#{r.generatedBy.username}"/>
                </p:column>
            </p:dataTable>
        </div>
    </ui:define>
</ui:composition>
</html>
