<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-stethoscope"></i> Manage Diagnoses</h2>
            <p:commandButton value="Add Diagnosis" icon="pi pi-plus" styleClass="btn-primary"
                             onclick="PF('diagDlg').show()"
                             action="#{medicalBean.prepareNewDiagnosis}"
                             update="diagForm" process="@this"/>
        </div>

        <p:growl id="msgs" life="4000"/>

        <div class="content-card">
            <p:dataTable id="diagTable" value="#{medicalBean.diagnoses}" var="d"
                         emptyMessage="No diagnoses found." styleClass="sms-table"
                         paginator="true" rows="10">
                <p:column headerText="Patient">
                    <h:outputText value="#{d.patient.firstName} #{d.patient.lastName}" rendered="#{d.patient != null}"/>
                </p:column>
                <p:column headerText="Nurse">
                    <h:outputText value="#{d.nurse.firstName} #{d.nurse.lastName}" rendered="#{d.nurse != null}"/>
                </p:column>
                <p:column headerText="Doctor">
                    <h:outputText value="#{d.doctor.firstName} #{d.doctor.lastName}" rendered="#{d.doctor != null}"/>
                </p:column>
                <p:column headerText="Status">
                    <h:outputText value="#{d.diagnosisStatus}"/>
                </p:column>
                <p:column headerText="Date">
                    <h:outputText value="#{d.date}"/>
                </p:column>
                <p:column headerText="Result">
                    <h:outputText value="#{d.result}"/>
                </p:column>
                <p:column headerText="Actions" style="width:120px">
                    <p:commandButton icon="pi pi-pencil" styleClass="btn-edit"
                                     action="#{medicalBean.editDiagnosis(d)}"
                                     onclick="PF('diagDlg').show()"
                                     update="diagForm" process="@this" title="Edit"/>
                    <p:commandButton icon="pi pi-trash" styleClass="btn-danger"
                                     action="#{medicalBean.deleteDiagnosis(d)}"
                                     update="diagTable msgs" process="@this" title="Delete">
                        <p:confirm header="Confirm Delete" message="Delete this diagnosis?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </div>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes btn-danger"/>
            <p:commandButton value="No"  type="button" styleClass="ui-confirmdialog-no"/>
        </p:confirmDialog>

        <p:dialog header="Diagnosis Details" widgetVar="diagDlg" modal="true" width="700" closeOnEscape="true">
            <h:form id="diagForm">
                <div class="form-grid">
                    <div class="form-field"><label>Patient (Student)</label>
                        <p:selectOneMenu value="#{medicalBean.selectedPatientId}">
                            <f:selectItem itemLabel="-- Select Patient --" itemValue="0"/>
                            <f:selectItems value="#{medicalBean.students}" var="s"
                                           itemLabel="#{s.firstName} #{s.lastName}" itemValue="#{s.studentId}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="form-field"><label>Nurse</label>
                        <p:selectOneMenu value="#{medicalBean.selectedNurseId}">
                            <f:selectItem itemLabel="-- Select Nurse --" itemValue="0"/>
                            <f:selectItems value="#{medicalBean.nurses}" var="n"
                                           itemLabel="#{n.firstName} #{n.lastName}" itemValue="#{n.nurseId}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="form-field"><label>Doctor</label>
                        <p:selectOneMenu value="#{medicalBean.selectedDoctorId}">
                            <f:selectItem itemLabel="-- Select Doctor --" itemValue="0"/>
                            <f:selectItems value="#{medicalBean.doctors}" var="d"
                                           itemLabel="#{d.firstName} #{d.lastName}" itemValue="#{d.doctorId}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="form-field"><label>Status</label>
                        <p:selectOneMenu value="#{medicalBean.selectedDiagnosis.diagnosisStatus}">
                            <f:selectItem itemLabel="-- Select Status --" itemValue="#{null}"/>
                            <f:selectItems value="#{medicalBean.diagnosisStatuses}" var="st"
                                           itemLabel="#{st}" itemValue="#{st}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="form-field"><label>Date</label>
                        <p:datePicker value="#{medicalBean.selectedDiagnosis.date}"/>
                    </div>
                    <div class="form-field" style="grid-column:1/-1"><label>Result / Notes</label>
                        <p:inputTextarea value="#{medicalBean.selectedDiagnosis.result}" rows="4" style="width:100%"/>
                    </div>
                </div>
                <div class="dialog-footer">
                    <p:commandButton value="Save" icon="pi pi-check" styleClass="btn-primary"
                                     action="#{medicalBean.saveDiagnosis}"
                                     update="diagTable msgs" process="diagForm"
                                     oncomplete="if(!args.validationFailed) PF('diagDlg').hide()"/>
                    <p:commandButton value="Cancel" icon="pi pi-times"
                                     onclick="PF('diagDlg').hide()" type="button"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
</html>
