<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-users"></i> Manage Users</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <div class="content-card">
            <p:dataTable id="userTable" value="#{adminBean.users}" var="u"
                         emptyMessage="No users found." styleClass="sms-table"
                         paginator="true" rows="10">
                <p:column headerText="Username">
                    <h:outputText value="#{u.username}"/>
                </p:column>
                <p:column headerText="User Type">
                    <p:selectOneMenu value="#{u.userType}">
                        <f:selectItems value="#{u.userType.declaringClass.enumConstants}"
                                       var="ut" itemLabel="#{ut}" itemValue="#{ut}"/>
                    </p:selectOneMenu>
                </p:column>
                <p:column headerText="Actions" style="width:100px">
                    <p:commandButton value="Save" icon="pi pi-check" styleClass="btn-primary"
                                     action="#{adminBean.saveUser(u)}"
                                     update="userTable msgs" process="userTable"/>
                </p:column>
            </p:dataTable>
        </div>
    </ui:define>
</ui:composition>
</html>
