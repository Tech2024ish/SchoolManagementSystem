<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-clipboard-list"></i> Student Behavior</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <h:form id="behaviorForm">
            <div class="content-card" style="margin-bottom:20px;">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Select Student</label>
                        <p:selectOneMenu value="#{teacherBean.selectedStudentId}">
                            <f:selectItem itemLabel="-- Select Student --" itemValue="0"/>
                            <f:selectItems value="#{teacherBean.students}" var="s"
                                           itemLabel="#{s.firstName} #{s.lastName}" itemValue="#{s.studentId}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="form-field">
                        <label>Behavior</label>
                        <p:selectOneMenu value="#{teacherBean.selectedBehavior.behavior}">
                            <f:selectItem itemLabel="-- Select --" itemValue="#{null}"/>
                            <f:selectItem itemLabel="Good" itemValue="Good"/>
                            <f:selectItem itemLabel="Misconduct" itemValue="Misconduct"/>
                            <f:selectItem itemLabel="Active" itemValue="Active"/>
                            <f:selectItem itemLabel="Shy" itemValue="Shy"/>
                            <f:selectItem itemLabel="Other" itemValue="Other"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="form-field">
                        <label>Date</label>
                        <p:datePicker value="#{teacherBean.selectedBehavior.date}" pattern="yyyy-MM-dd"/>
                    </div>
                    <div class="form-field" style="grid-column:1/-1">
                        <label>Description</label>
                        <p:inputTextarea value="#{teacherBean.selectedBehavior.description}" rows="3" style="width:100%"/>
                    </div>
                </div>
                <div style="display:flex;gap:10px;">
                    <p:commandButton value="Save Behavior" icon="pi pi-save" styleClass="btn-primary"
                                     action="#{teacherBean.saveBehavior}"
                                     update="behaviorTable msgs" process="behaviorForm"/>
                    <p:commandButton value="Load History" icon="pi pi-refresh"
                                     action="#{teacherBean.loadBehaviorByStudent}"
                                     update="behaviorTable" process="behaviorForm"/>
                </div>
            </div>
            <div class="content-card">
                <p:dataTable id="behaviorTable" value="#{teacherBean.behaviorList}" var="b"
                             emptyMessage="No behavior records." styleClass="sms-table">
                    <p:column headerText="Student">
                        <h:outputText value="#{b.student.firstName} #{b.student.lastName}"/>
                    </p:column>
                    <p:column headerText="Behavior">
                        <h:outputText value="#{b.behavior}"/>
                    </p:column>
                    <p:column headerText="Description">
                        <h:outputText value="#{b.description}"/>
                    </p:column>
                    <p:column headerText="Date">
                        <h:outputText value="#{b.date}"/>
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
