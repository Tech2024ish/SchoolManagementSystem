<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-bullhorn"></i> Announcements</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <h:form id="annForm">
            <div class="content-card" style="margin-bottom:20px;">
                <div class="form-grid">
                    <div class="form-field" style="grid-column:1/-1">
                        <label>Message</label>
                        <p:inputTextarea value="#{teacherBean.newAnnouncement.message}" rows="3" style="width:100%"/>
                    </div>
                    <div class="form-field">
                        <label>Date</label>
                        <p:datePicker value="#{teacherBean.newAnnouncement.date}" pattern="yyyy-MM-dd"/>
                    </div>
                    <div class="form-field">
                        <label>Target Group</label>
                        <p:selectOneMenu value="#{teacherBean.newAnnouncement.targetGroup}">
                            <f:selectItem itemLabel="-- Select --" itemValue="#{null}"/>
                            <f:selectItem itemLabel="Students" itemValue="Students"/>
                            <f:selectItem itemLabel="All" itemValue="All"/>
                        </p:selectOneMenu>
                    </div>
                </div>
                <p:commandButton value="Post" icon="pi pi-send" styleClass="btn-primary"
                                 action="#{teacherBean.saveAnnouncement}"
                                 update="annTable msgs" process="annForm"/>
            </div>
            <div class="content-card">
                <p:dataTable id="annTable" value="#{teacherBean.announcements}" var="ann"
                             emptyMessage="No announcements." styleClass="sms-table" paginator="true" rows="10">
                    <p:column headerText="Date"><h:outputText value="#{ann.date}"/></p:column>
                    <p:column headerText="Target"><h:outputText value="#{ann.targetGroup}"/></p:column>
                    <p:column headerText="Message"><h:outputText value="#{ann.message}"/></p:column>
                </p:dataTable>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
