<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-book"></i> Courses</h2>
            <p:commandButton value="Add Course" icon="pi pi-plus" styleClass="btn-primary"
                             onclick="PF('courseDlg').show()" type="button"/>
        </div>
        <p:growl id="msgs" life="4000"/>
        <div class="content-card">
            <p:dataTable id="courseTable" value="#{teacherBean.courses}" var="c"
                         emptyMessage="No courses." styleClass="sms-table" paginator="true" rows="10">
                <p:column headerText="Course Name">
                    <h:outputText value="#{c.courseName}"/>
                </p:column>
                <p:column headerText="Description">
                    <h:outputText value="#{c.description}"/>
                </p:column>
                <p:column headerText="Actions" style="width:120px">
                    <p:commandButton icon="pi pi-pencil" styleClass="btn-edit"
                                     action="#{teacherBean.editCourse(c)}"
                                     onclick="PF('courseDlg').show()"
                                     update="courseForm" process="@this"/>
                    <p:commandButton icon="pi pi-trash" styleClass="btn-danger"
                                     action="#{teacherBean.deleteCourse(c.courseId)}"
                                     update="courseTable msgs" process="@this">
                        <p:confirm header="Delete?" message="Delete this course?"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </div>
        <p:confirmDialog global="true" showEffect="fade">
            <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes btn-danger"/>
            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no"/>
        </p:confirmDialog>
        <p:dialog header="Course" widgetVar="courseDlg" modal="true" width="500">
            <h:form id="courseForm">
                <div class="form-field">
                    <label>Course Name</label>
                    <p:inputText value="#{teacherBean.selectedCourse.courseName}" required="true" style="width:100%"/>
                </div>
                <div class="form-field">
                    <label>Description</label>
                    <p:inputTextarea value="#{teacherBean.selectedCourse.description}" rows="3" style="width:100%"/>
                </div>
                <div class="dialog-footer">
                    <p:commandButton value="Save" icon="pi pi-check" styleClass="btn-primary"
                                     action="#{teacherBean.saveCourse}"
                                     update="courseTable msgs" process="courseForm"
                                     oncomplete="if(!args.validationFailed) PF('courseDlg').hide()"/>
                    <p:commandButton value="Cancel" type="button" onclick="PF('courseDlg').hide()"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
</html>
