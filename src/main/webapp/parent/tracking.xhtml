<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-map-marker-alt"></i> Child's Tracking</h2>
        </div>
        <div class="content-card">
            <p:dataTable value="#{parentBean.childTracking}" var="t"
                         emptyMessage="No tracking records." styleClass="sms-table" paginator="true" rows="10">
                <p:column headerText="Date"><h:outputText value="#{t.date}"/></p:column>
                <p:column headerText="Status"><h:outputText value="#{t.status}"/></p:column>
                <p:column headerText="Progress"><h:outputText value="#{t.progress}"/></p:column>
                <p:column headerText="Location"><h:outputText value="#{t.location}"/></p:column>
            </p:dataTable>
        </div>
    </ui:define>
</ui:composition>
</html>
