<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <h2><i class="fas fa-calendar-check"></i> Appointments</h2>
        </div>
        <p:growl id="msgs" life="4000"/>
        <h:form id="aptForm">
            <div class="content-card" style="margin-bottom:20px;">
                <div class="form-grid">
                    <div class="form-field" style="grid-column:1/-1">
                        <label>Purpose</label>
                        <p:inputTextarea value="#{parentBean.newAppointment.purpose}" rows="3" style="width:100%" required="true"/>
                    </div>
                    <div class="form-field">
                        <label>Date</label>
                        <p:datePicker value="#{parentBean.newAppointment.date}" pattern="yyyy-MM-dd"/>
                    </div>
                </div>
                <p:commandButton value="Book Appointment" icon="pi pi-calendar-plus" styleClass="btn-primary"
                                 action="#{parentBean.bookAppointment}"
                                 update="msgs" process="aptForm"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
